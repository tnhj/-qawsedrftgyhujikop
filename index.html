<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7桁数値記憶テスト (モノクロ・528Hz版)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --success-color: #27ae60;
            --danger-color: #c0392b;
            --dark-color: #2c3e50;
            --light-color: #f5f7fa;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--light-color);
            color: var(--dark-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        /* 🎵 528Hzコントロールパネル */
        .sound-control-panel {
            background: #f0f4f8;
            border: 1px solid #d0dbe5;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .sound-control-panel label {
            font-weight: bold;
            font-size: 14px;
        }

        .sound-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        select.sound-select {
            padding: 6px 10px;
            font-size: 13px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
            font-weight: bold;
        }

        .volume-slider {
            width: 70px;
            cursor: pointer;
        }

        .info-panel, .game-panel, .result-panel, .history-panel {
            display: none;
            margin-bottom: 20px;
        }

        .active {
            display: block;
        }

        .btn-start {
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            color: white;
            background-color: #34495e;
            width: 100%;
            transition: opacity 0.2s;
            margin-top: 15px;
        }

        .btn-start:hover {
            opacity: 0.9;
        }

        button.general-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        
        button.csv-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
            font-weight: bold;
        }
        button.csv-btn:hover { background-color: #219653; }

        #status {
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #display-area {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 5px;
            height: 70px;
            line-height: 70px;
            margin: 20px 0;
            background: #eef2f7;
            border-radius: 8px;
            color: #2c3e50; /* 固定色 */
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 6px;
            letter-spacing: 3px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }

        .feedback.correct { background-color: #d4edda; color: #155724; }
        .feedback.incorrect { background-color: #f8d7da; color: #721c24; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }

        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background-color: #f2f2f2; }

        .text-success { color: var(--success-color); font-weight: bold; }
        .text-danger { color: var(--danger-color); font-weight: bold; }

        .summary-box {
            background: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .rules-list { padding-left: 20px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <h1 id="game-title">🧠 7桁数値記憶テスト</h1>

    <!-- 🎵 528Hzコントロールパネル -->
    <div class="sound-control-panel">
        <label for="sound-select">🔔 528Hzサウンド:</label>
        <div class="sound-controls">
            <select id="sound-select" class="sound-select" onchange="toggleSound(this.value)">
                <option value="off">オフ</option>
                <option value="continuous">連続音</option>
                <option value="pulse">パルス（ぶつ切り）</option>
            </select>

            <label for="bpm-select" style="font-size:12px; margin-left:4px;">テンポ:</label>
            <select id="bpm-select" class="sound-select" onchange="changeBPM(this.value)">
                <option value="60">60 BPM</option>
                <option value="90">90 BPM</option>
                <option value="120" selected>120 BPM</option>
                <option value="150">150 BPM</option>
                <option value="180">180 BPM</option>
            </select>

            <span style="font-size:12px; font-weight:bold; color:#666; margin-left:4px;">音量:</span>
            <input type="range" id="sound-volume" class="volume-slider" min="0" max="1" step="0.05" value="0.1" oninput="changeVolume(this.value)">
        </div>
    </div>

    <!-- 1. 説明画面 -->
    <div id="info-panel" class="info-panel active">
        <h3>🎮 ルール</h3>
        <ul class="rules-list">
            <li>全10問の記憶力テストです（数字7桁、表示時間3秒）。</li>
            <li>528Hzサウンド（連続音・パルス音）やテンポを設定してテストを開始できます。</li>
        </ul>
        
        <button class="btn-start" onclick="startGame()">▶️ テストを開始する</button>
    </div>

    <!-- 2. ゲーム画面 -->
    <div id="game-panel" class="game-panel">
        <div id="status">問題 1 / 10</div>
        <div id="display-area">---</div>
        
        <div class="input-group">
            <input type="text" id="answer-input" maxlength="7" autocomplete="off" placeholder="数字を入力" disabled>
            <button id="submit-btn" onclick="submitAnswer()" style="width: auto; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; padding: 0 20px;" disabled>回答</button>
        </div>

        <div id="feedback-area"></div>
    </div>

    <!-- 3. 結果画面 -->
    <div id="result-panel" class="result-panel">
        <h2>📊 テスト結果</h2>
        <div class="summary-box">
            <p>今回正答数: <span id="res-correct"></span> / 10 (<span id="res-rate"></span>%)</p>
            <p>今回平均時間: <span id="res-avg-time"></span>秒</p>
        </div>

        <button class="csv-btn" onclick="downloadCSV()">💾 履歴をCSVでダウンロード</button>

        <h3>今回の問題ごとの詳細データ</h3>
        <div style="overflow-x: auto;">
            <table id="detail-table">
                <thead>
                    <tr>
                        <th>問</th>
                        <th>合否</th>
                        <th>正答</th>
                        <th>あなたの回答</th>
                        <th>時間</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <button class="general-btn" onclick="resetToHome()" style="margin-top:20px;">トップに戻る</button>
    </div>

    <!-- 4. 履歴セクション -->
    <div id="history-panel" class="history-panel active" style="margin-top: 30px; border-top: 1px solid #ddd; padding-top: 20px;">
        <h3>💾 本日の実施履歴</h3>
        <table id="history-table">
            <thead>
                <tr>
                    <th>回数</th>
                    <th>正答率</th>
                    <th>平均回答時間</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const TOTAL_QUESTIONS = 10;
    let currentQuestion = 0;
    let targetNumber = "";
    let startTime = 0;
    let results = []; 

    // -------------------------------------------------------------
    // 🔔 Web Audio API による 528Hz 音声生成処理
    // -------------------------------------------------------------
    let audioCtx = null;
    let oscillator = null;
    let gainNode = null;
    let pulseTimer = null;
    let currentSoundMode = 'off';

    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
    }

    function start528HzMode(mode) {
        initAudio();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        stop528Hz();
        currentSoundMode = mode;

        if (mode === 'off') return;

        oscillator = audioCtx.createOscillator();
        gainNode = audioCtx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(528, audioCtx.currentTime);

        const targetVol = parseFloat(document.getElementById('sound-volume').value);

        if (mode === 'continuous') {
            gainNode.gain.setValueAtTime(targetVol, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
        } else if (mode === 'pulse') {
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();

            startPulseLoop();
        }
    }

    function startPulseLoop() {
        if (pulseTimer) clearInterval(pulseTimer);

        const bpm = parseInt(document.getElementById('bpm-select').value);
        const intervalMs = (60 / bpm) * 1000; 
        const durSeconds = (intervalMs / 1000) * 0.5;

        function triggerPulse() {
            if (!gainNode || !audioCtx || currentSoundMode !== 'pulse') return;
            const targetVol = parseFloat(document.getElementById('sound-volume').value);
            const now = audioCtx.currentTime;

            gainNode.gain.cancelScheduledValues(now);
            gainNode.gain.setValueAtTime(0, now);
            gainNode.gain.linearRampToValueAtTime(targetVol, now + 0.005);
            gainNode.gain.setValueAtTime(targetVol, now + durSeconds - 0.005);
            gainNode.gain.linearRampToValueAtTime(0, now + durSeconds);
        }

        triggerPulse();
        pulseTimer = setInterval(triggerPulse, intervalMs);
    }

    function stop528Hz() {
        if (pulseTimer) {
            clearInterval(pulseTimer);
            pulseTimer = null;
        }
        if (oscillator) {
            try {
                oscillator.stop();
                oscillator.disconnect();
            } catch (e) {}
            oscillator = null;
        }
    }

    function toggleSound(val) {
        start528HzMode(val);
    }

    function changeBPM(val) {
        if (currentSoundMode === 'pulse') {
            startPulseLoop();
        }
    }

    function changeVolume(val) {
        if (gainNode && audioCtx && currentSoundMode === 'continuous') {
            gainNode.gain.setValueAtTime(parseFloat(val), audioCtx.currentTime);
        }
    }

    // -------------------------------------------------------------
    // ゲームロジック
    // -------------------------------------------------------------
    const infoPanel = document.getElementById('info-panel');
    const gamePanel = document.getElementById('game-panel');
    const resultPanel = document.getElementById('result-panel');
    const statusText = document.getElementById('status');
    const displayArea = document.getElementById('display-area');
    const answerInput = document.getElementById('answer-input');
    const submitBtn = document.getElementById('submit-btn');
    const feedbackArea = document.getElementById('feedback-area');

    window.onload = function() {
        displayHistory();
    };

    answerInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !submitBtn.disabled) {
            submitAnswer();
        }
    });

    function startGame() {
        infoPanel.classList.remove('active');
        resultPanel.classList.remove('active');
        gamePanel.classList.add('active');
        currentQuestion = 0;
        results = [];

        const selectedSound = document.getElementById('sound-select').value;
        if (selectedSound !== 'off') {
            start528HzMode(selectedSound);
        }

        nextQuestion();
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion > TOTAL_QUESTIONS) {
            endGame();
            return;
        }

        statusText.innerText = `問題 ${currentQuestion} / ${TOTAL_QUESTIONS}`;
        feedbackArea.innerHTML = "";
        answerInput.value = "";
        answerInput.disabled = true;
        submitBtn.disabled = true;

        displayArea.style.color = "var(--dark-color)";
        targetNumber = Math.floor(1000000 + Math.random() * 9000000).toString();
        displayArea.innerText = targetNumber;

        setTimeout(() => {
            displayArea.innerText = "*******";
            answerInput.disabled = false;
            submitBtn.disabled = false;
            answerInput.focus();
            startTime = performance.now();
        }, 3000);
    }

    function submitAnswer() {
        const endTime = performance.now();
        const answerTime = ((endTime - startTime) / 1000).toFixed(2);
        const userAnswer = answerInput.value.trim();

        answerInput.disabled = true;
        submitBtn.disabled = true;
        const isCorrect = (userAnswer === targetNumber);
        
        results.push({
            num: currentQuestion,
            isCorrect: isCorrect,
            target: targetNumber,
            answer: userAnswer || "未入力",
            time: parseFloat(answerTime)
        });

        if (!isCorrect) {
            feedbackArea.className = "feedback incorrect";
            feedbackArea.innerHTML = `❌ 不正解<br><span style="font-size:14px;">正答: ${targetNumber}</span>`;
        } else {
            feedbackArea.className = "feedback correct";
            feedbackArea.innerHTML = `○ 正解！`;
        }

        setTimeout(() => { nextQuestion(); }, 1500);
    }

    function endGame() {
        gamePanel.classList.remove('active');
        resultPanel.classList.add('active');

        const correctCount = results.filter(r => r.isCorrect).length;
        const successRate = (correctCount / TOTAL_QUESTIONS) * 100;
        const totalTime = results.reduce((sum, r) => sum + r.time, 0);
        const avgTime = (totalTime / TOTAL_QUESTIONS).toFixed(2);

        document.getElementById('res-correct').innerText = correctCount;
        document.getElementById('res-rate').innerText = successRate;
        document.getElementById('res-avg-time').innerText = avgTime;

        const tbody = document.querySelector('#detail-table tbody');
        tbody.innerHTML = "";
        results.forEach(r => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${r.num}</td>
                <td class="${r.isCorrect ? 'text-success' : 'text-danger'}">${r.isCorrect ? '○' : '×'}</td>
                <td>${r.target}</td>
                <td class="${r.isCorrect ? '' : 'text-danger'}">${r.answer}</td>
                <td>${r.time}秒</td>
            `;
            tbody.appendChild(tr);
        });

        saveToLocalStorage(successRate, parseFloat(avgTime));
    }

    function saveToLocalStorage(rate, avgTime) {
        const today = new Date().toLocaleDateString();
        let history = JSON.parse(localStorage.getItem('memory_test_simple_history')) || {};

        if (!history[today]) { history[today] = { rates: [], times: [] }; }

        history[today].rates.push(rate);
        history[today].times.push(avgTime);

        localStorage.setItem('memory_test_simple_history', JSON.stringify(history));
        displayHistory();
    }

    function downloadCSV() {
        const history = JSON.parse(localStorage.getItem('memory_test_simple_history')) || {};
        let csvContent = "日付,試行回数,正答率(%),平均回答時間(秒)\n";

        Object.keys(history).sort().forEach(date => {
            const rates = history[date].rates;
            const times = history[date].times;
            for(let i = 0; i < rates.length; i++) {
                csvContent += `"${date}",${i+1},${rates[i]},${times[i]}\n`;
            }
        });

        const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
        const blob = new Blob([bom, csvContent], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        if (link.download !== undefined) {
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `memory_test_history.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    }

    function displayHistory() {
        const history = JSON.parse(localStorage.getItem('memory_test_simple_history')) || {};
        const tbody = document.querySelector('#history-table tbody');
        tbody.innerHTML = "";
        const today = new Date().toLocaleDateString();
        const todayData = history[today];

        if (!todayData || todayData.rates.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" style="color:#999;">本日のデータはまだありません</td></tr>`;
            return;
        }

        for (let i = 0; i < todayData.rates.length; i++) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>第 ${i + 1} 回目</td>
                <td>${todayData.rates[i]}%</td>
                <td>${todayData.times[i]}秒</td>
            `;
            tbody.appendChild(tr);
        }
    }

    function resetToHome() {
        resultPanel.classList.remove('active');
        infoPanel.classList.add('active');
    }
</script>

</body>
</html>
