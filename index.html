<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7桁数値記憶テスト (順唱形式)</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --danger-color: #e74c3c;
            --dark-color: #2c3e50;
            --light-color: #f5f7fa;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--light-color);
            color: var(--dark-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary-color);
        }

        .info-panel, .game-panel, .result-panel, .history-panel {
            display: none;
            margin-bottom: 20px;
        }

        .active {
            display: block;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #status {
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #display-area {
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 5px;
            height: 70px;
            line-height: 70px;
            margin: 20px 0;
            background: #eef2f7;
            border-radius: 8px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 20px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 6px;
            letter-spacing: 3px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }

        .feedback.correct {
            background-color: #d4edda;
            color: #155724;
        }

        .feedback.incorrect {
            background-color: #f8d7da;
            color: #721c24;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .text-success { color: var(--success-color); font-weight: bold; }
        .text-danger { color: var(--danger-color); font-weight: bold; }

        .summary-box {
            background: #eef2f7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .summary-box p {
            margin: 5px 0;
            font-size: 16px;
        }

        .rules-list {
            padding-left: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧠 7桁数値記憶テスト (順唱)</h1>

    <div id="info-panel" class="info-panel active">
        <h3>🎮 ルール</h3>
        <ul class="rules-list">
            <li>全10問の記憶力テストです。</li>
            <li>毎回ランダムな<b>7桁の数字</b>が<b>3秒間</b>表示されます。</li>
            <li>数字が消えたら、そのまま同じ数字を入力してください。</li>
            <li>Enterキーまたは回答ボタンで判定します。</li>
        </ul>
        <button id="start-btn" onclick="startGame()">テスト開始</button>
    </div>

    <div id="game-panel" class="game-panel">
        <div id="status">問題 1 / 10</div>
        <div id="display-area">---</div>
        
        <div class="input-group">
            <input type="text" id="answer-input" maxlength="7" autocomplete="off" placeholder="数字を入力" disabled>
            <button id="submit-btn" onclick="submitAnswer()" style="width: auto;" disabled>回答</button>
        </div>

        <div id="feedback-area"></div>
    </div>

    <div id="result-panel" class="result-panel">
        <h2>📊 テスト結果</h2>
        <div class="summary-box">
            <p>総合評価: <span id="res-score" style="font-weight:bold; font-size:18px;"></span></p>
            <p>正答数: <span id="res-correct"></span> / 10</p>
            <p>誤答数: <span id="res-incorrect"></span> / 10</p>
            <p>正答率: <span id="res-rate"></span>%</p>
            <p>平均回答時間: <span id="res-avg-time"></span>秒</p>
        </div>

        <h3>問題ごとの詳細</h3>
        <table id="detail-table">
            <thead>
                <tr>
                    <th>問</th>
                    <th>合否</th>
                    <th>正導</th>
                    <th>あなたの回答</th>
                    <th>時間</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <button onclick="resetToHome()" style="margin-top:20px;">ホームに戻る</button>
    </div>

    <div id="history-panel" class="history-panel active" style="margin-top: 30px; border-top: 1px solid #ddd; padding-top: 20px;">
        <h3>💾 本日の記録 (LocalStorage)</h3>
        <table id="history-table">
            <thead>
                <tr>
                    <th>日付</th>
                    <th>実施回数</th>
                    <th>平均正答率</th>
                    <th>平均回答時間</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const TOTAL_QUESTIONS = 10;
    let currentQuestion = 0;
    let targetNumber = "";
    let startTime = 0;
    let results = []; // 各問の結果を格納 { num, isCorrect, target, answer, time }

    // DOM要素
    const infoPanel = document.getElementById('info-panel');
    const gamePanel = document.getElementById('game-panel');
    const resultPanel = document.getElementById('result-panel');
    const startBtn = document.getElementById('start-btn');
    const statusText = document.getElementById('status');
    const displayArea = document.getElementById('display-area');
    const answerInput = document.getElementById('answer-input');
    const submitBtn = document.getElementById('submit-btn');
    const feedbackArea = document.getElementById('feedback-area');

    // 起動時に履歴を表示
    window.onload = function() {
        displayHistory();
    };

    // Enterキーでの回答送信に対応
    answerInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !submitBtn.disabled) {
            submitAnswer();
        }
    });

    // ゲーム開始
    function startGame() {
        // 仕様: テスト開始後はSTARTボタン無効、再スタート不可
        startBtn.disabled = true;
        infoPanel.classList.remove('active');
        resultPanel.classList.remove('active');
        gamePanel.classList.add('active');
        
        currentQuestion = 0;
        results = [];
        
        nextQuestion();
    }

    // 次の問題へ
    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion > TOTAL_QUESTIONS) {
            endGame();
            return;
        }

        // 状態リセット
        statusText.innerText = `問題 ${currentQuestion} / ${TOTAL_QUESTIONS}`;
        feedbackArea.innerHTML = "";
        answerInput.value = "";
        answerInput.disabled = true;
        submitBtn.disabled = true;

        // 7桁のランダムな数字を生成
        targetNumber = Math.floor(1000000 + Math.random() * 9000000).toString();
        displayArea.innerText = targetNumber;

        // 3秒後に数字を消す
        setTimeout(() => {
            displayArea.innerText = "*******";
            answerInput.disabled = false;
            submitBtn.disabled = false;
            answerInput.focus();
            startTime = performance.now(); // 計測開始
        }, 3000);
    }

    // 回答送信
    function submitAnswer() {
        const endTime = performance.now();
        const answerTime = ((endTime - startTime) / 1000).toFixed(2); // 秒単位に変形
        const userAnswer = answerInput.value.trim();

        // ロック
        answerInput.disabled = true;
        submitBtn.disabled = true;

        const isCorrect = (userAnswer === targetNumber);
        
        results.push({
            num: currentQuestion,
            isCorrect: isCorrect,
            target: targetNumber,
            answer: userAnswer || "未入力",
            time: parseFloat(answerTime)
        });

        // 不正解時の即時フィードバック仕様
        if (!isCorrect) {
            feedbackArea.className = "feedback incorrect";
            feedbackArea.innerHTML = `❌ 不正解<br><span style="font-size:14px;">正答: ${targetNumber}<br>回答: ${userAnswer || "なし"}</span>`;
        } else {
            feedbackArea.className = "feedback correct";
            feedbackArea.innerHTML = `○ 正解！`;
        }

        // 2秒後に次の問題、または結果表示へ
        setTimeout(() => {
            nextQuestion();
        }, 2000);
    }

    // ゲーム終了・結果表示
    function endGame() {
        gamePanel.classList.remove('active');
        resultPanel.classList.add('active');

        const correctCount = results.filter(r => r.isCorrect).length;
        const incorrectCount = TOTAL_QUESTIONS - correctCount;
        const successRate = (correctCount / TOTAL_QUESTIONS) * 100;
        const totalTime = results.reduce((sum, r) => sum + r.time, 0);
        const avgTime = (totalTime / TOTAL_QUESTIONS).toFixed(2);

        // 結果書き込み
        document.getElementById('res-score').innerText = successRate === 100 ? "完璧です！🧠" : successRate >= 70 ? "素晴らしい記憶力です！" : "ナイスチャレンジ！";
        document.getElementById('res-correct').innerText = correctCount;
        document.getElementById('res-incorrect').innerText = incorrectCount;
        document.getElementById('res-rate').innerText = successRate;
        document.getElementById('res-avg-time').innerText = avgTime;

        // 詳細テーブル生成
        const tbody = document.querySelector('#detail-table tbody');
        tbody.innerHTML = "";
        results.forEach(r => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${r.num}</td>
                <td class="${r.isCorrect ? 'text-success' : 'text-danger'}">${r.isCorrect ? '○' : '×'}</td>
                <td>${r.target}</td>
                <td class="${r.isCorrect ? '' : 'text-danger'}">${r.answer}</td>
                <td>${r.time}秒</td>
            `;
            tbody.appendChild(tr);
        });

        // LocalStorageに保存
        saveToLocalStorage(successRate, parseFloat(avgTime));
    }

    // LocalStorage保存処理
    function saveToLocalStorage(rate, avgTime) {
        const today = new Date().toLocaleDateString();
        let history = JSON.parse(localStorage.getItem('memory_test_history')) || {};

        if (!history[today]) {
            history[today] = { rates: [], times: [] };
        }

        history[today].rates.push(rate);
        history[today].times.push(avgTime);

        localStorage.setItem('memory_test_history', JSON.stringify(history));
        displayHistory();
    }

    // 履歴表示処理
    function displayHistory() {
        const history = JSON.parse(localStorage.getItem('memory_test_history')) || {};
        const tbody = document.querySelector('#history-table tbody');
        tbody.innerHTML = "";

        const dates = Object.keys(history).sort().reverse(); // 新しい順

        if (dates.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="color:#999;">本日のデータはまだありません</td></tr>`;
            return;
        }

        dates.forEach(date => {
            const data = history[date];
            const count = data.rates.length;
            const avgRate = (data.rates.reduce((a, b) => a + b, 0) / count).toFixed(1);
            const avgTime = (data.times.reduce((a, b) => a + b, 0) / count).toFixed(2);

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${date}</td>
                <td>${count}回</td>
                <td>${avgRate}%</td>
                <td>${avgTime}秒</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // ホームに戻って再挑戦可能にする
    function resetToHome() {
        resultPanel.classList.remove('active');
        infoPanel.classList.add('active');
        startBtn.disabled = false; // 再スタートを許可する状態に戻す
    }
</script>

</body>
</html>
